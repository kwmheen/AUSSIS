<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AUSSIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 600: '#4A74E6', 700: '#123088' } } } }
        }
    </script>
    <style>
        html, body { height: 100%; }
        body { touch-action: manipulation; }
        canvas { touch-action: none; }
        #padActions, #padActions button { touch-action: manipulation; }
    </style>
</head>
<body class="h-dvh overflow-hidden bg-white text-slate-800">

    <div class="h-full w-full flex flex-col">
        <div class="shrink-0 text-white px-4 py-3 flex justify-between items-center gap-3" style="background:#4A74E6">
            <div class="min-w-0">
                <h1 class="font-bold leading-none">AUSSIS</h1>
                <p class="text-[10px] font-light text-white/80 mt-1">Automated User System Signature Interface</p>
            </div>
            <span id="pNameDisplay" class="text-sm font-light text-right"></span>
        </div>

        <p id="fieldProgress" class="shrink-0 px-4 pt-3 text-xs font-bold text-slate-500">서명란을 불러오는 중</p>
        <div id="padStage" class="flex-1 min-h-0 overflow-hidden flex items-center justify-center">
            <div id="padFrame" class="relative bg-white border-2 border-slate-300 rounded-2xl overflow-hidden" style="width:95vw; height:12rem;">
                <img id="regionImage" alt="" class="w-full h-full object-fill block select-none pointer-events-none bg-white">
                <canvas id="padCanvas" class="absolute inset-0 w-full h-full"></canvas>
            </div>
        </div>
        <div id="emptyState" class="hidden flex-1 min-h-0 flex items-center justify-center text-slate-500 text-sm font-medium text-center px-6">
            서명란을 불러오는 중
        </div>

        <div id="padActions" class="shrink-0 px-4 pt-3 flex justify-between items-center gap-3" style="padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));">
            <button onclick="clearCanvas()" class="px-4 py-3 bg-slate-100 text-slate-600 rounded-xl text-sm font-bold flex items-center space-x-1">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>지우기</span>
            </button>
            <button id="sendBtn" onclick="sendSignature()" class="px-6 py-3 bg-brand-600 text-white rounded-xl text-sm font-bold shadow-md flex items-center space-x-2">
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>서명 전송</span>
            </button>
        </div>
        <p id="padStatus" class="shrink-0 px-4 pb-2 text-[11px] text-slate-500 text-center min-h-[1rem]"></p>
    </div>

    <script>
        let ws;
        let canvas, ctx, isDrawing = false;
        let currentFields = [];
        let regions = {};
        let activeFieldId = null;
        let shownRegion = '';
        let documentName = '';
        let sessionMode = '';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            canvas = document.getElementById('padCanvas');
            ctx = canvas.getContext('2d');
            document.getElementById('regionImage').addEventListener('load', layoutPadSurface);
            window.addEventListener('resize', layoutPadSurface);
            attachListeners();
            initWebSocket();
        });

        function orderedFields(list = currentFields) {
            return [...list].sort((a, b) => (
                (Number(a.page) - Number(b.page))
                || (Number(a.y) - Number(b.y))
                || (Number(a.x) - Number(b.x))
            ));
        }

        function nextUnsigned(list = currentFields) {
            return orderedFields(list).find(field => !field.signed) || null;
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            if (rect.width < 2 || rect.height < 2) return;
            const ratio = window.devicePixelRatio || 2;
            const nextWidth = Math.round(rect.width * ratio);
            const nextHeight = Math.round(rect.height * ratio);
            if (canvas.width === nextWidth && canvas.height === nextHeight) return;
            canvas.width = nextWidth;
            canvas.height = nextHeight;
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = 2.5;
        }

        function layoutPadSurface() {
            const stage = document.getElementById('padStage');
            const frame = document.getElementById('padFrame');
            const img = document.getElementById('regionImage');
            if (!stage || stage.classList.contains('hidden') || !frame) return;
            let aspect = Number(frame.dataset.aspect);
            if (img.naturalWidth && img.naturalHeight) aspect = img.naturalWidth / img.naturalHeight;
            if (!aspect || !Number.isFinite(aspect)) aspect = 3;
            const maxWidth = Math.max(160, Math.min(window.innerWidth * 0.95, stage.clientWidth || window.innerWidth * 0.95));
            const maxHeight = Math.max(120, stage.clientHeight - 4);
            let width = maxWidth;
            let height = width / aspect;
            if (height > maxHeight) {
                height = maxHeight;
                width = Math.min(maxWidth, height * aspect);
            }
            frame.style.width = `${width}px`;
            frame.style.height = `${height}px`;
            resizeCanvas();
        }

        function initWebSocket() {
            const loc = window.location;
            ws = new WebSocket(`ws://${loc.host}/ws`);
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'INIT_STATE') {
                    const data = msg.data || {};
                    currentFields = data.fields || msg.fields || [];
                    regions = data.regions || {};
                    if (data.participant && data.participant.name) {
                        document.getElementById('pNameDisplay').textContent = `${data.participant.name} 님`;
                    }
                    applyState();
                } else if (msg.type === 'SESSION') {
                    currentFields = msg.fields || [];
                    regions = {};
                    shownRegion = '';
                    activeFieldId = null;
                    documentName = msg.documentName || '';
                    sessionMode = msg.mode || '';
                    if (msg.participant && msg.participant.name) {
                        document.getElementById('pNameDisplay').textContent = `${msg.participant.name} 님`;
                    }
                    if (msg.mode === 'prep') {
                        document.getElementById('padStatus').textContent = 'PDF 설정 중입니다.';
                    }
                    applyState();
                } else if (msg.type === 'FIELDS_UPDATED' || msg.type === 'SIGNATURE_RECEIVED') {
                    if (msg.fields) currentFields = msg.fields;
                    applyState();
                } else if (msg.type === 'REGIONS_UPDATED') {
                    regions = msg.regions || {};
                    applyState();
                } else if (msg.type === 'PARTICIPANT_UPDATED') {
                    document.getElementById('pNameDisplay').textContent = `${msg.participant.name} 님`;
                }
            };
        }

        function regionOf(field) {
            if (!field) return null;
            const region = regions[field.id];
            if (!region) return null;
            if (typeof region === 'string') return { image: region, aspect: 0 };
            return region;
        }

        function applyState() {
            const active = nextUnsigned();
            const nextId = active ? active.id : null;
            const changed = nextId !== activeFieldId;
            activeFieldId = nextId;
            const stage = document.getElementById('padStage');
            const empty = document.getElementById('emptyState');
            const actions = document.getElementById('padActions');
            const progress = document.getElementById('fieldProgress');
            const frame = document.getElementById('padFrame');
            const ordered = orderedFields();
            stage.dataset.activeId = nextId || '';

            if (!active) {
                stage.classList.add('hidden');
                actions.classList.add('hidden');
                empty.classList.remove('hidden');
                empty.textContent = ordered.length ? '모든 서명이 완료되었습니다.' : 'PC에서 서명란을 먼저 추가해 주세요.';
                progress.textContent = ordered.length ? `완료 ${ordered.length}/${ordered.length}` : '서명란 없음';
                document.getElementById('padStatus').textContent = ordered.length ? '모든 서명란을 전송했습니다.' : '';
                return;
            }

            stage.classList.remove('hidden');
            actions.classList.remove('hidden');
            empty.classList.add('hidden');
            const index = ordered.findIndex(field => field.id === active.id) + 1;
            const docLabel = documentName ? `${documentName} · ` : '';
            progress.textContent = `${docLabel}서명 ${index}/${ordered.length} · ${active.page}페이지`;
            const region = regionOf(active);
            if (region && region.aspect) frame.dataset.aspect = String(region.aspect);
            const image = region && region.image ? region.image : '';
            const img = document.getElementById('regionImage');
            if (image !== shownRegion) {
                shownRegion = image;
                img.src = image;
                if (!changed) clearCanvas();
            }
            if (changed) {
                clearCanvas();
                document.getElementById('padStatus').textContent = index === 1 ? '표시된 서명란 영역 안에 서명해 주세요.' : '다음 서명란입니다. 이 영역 안에 서명해 주세요.';
            }
            layoutPadSurface();
        }

        function attachListeners() {
            let lastX = 0, lastY = 0;
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function start(e) {
                e.preventDefault();
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x; lastY = pos.y;
            }

            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x; lastY = pos.y;
            }

            function stop() { isDrawing = false; }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        function clearCanvas() {
            const rect = canvas.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
        }

        function sendSignature() {
            if (sessionMode === 'prep') {
                document.getElementById('padStatus').textContent = 'PDF 설정 중에는 서명하지 않습니다.';
                return;
            }
            const targetField = nextUnsigned();
            if (!targetField) {
                document.getElementById('padStatus').textContent = 'PC에서 서명란을 먼저 추가해 주세요.';
                return;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                document.getElementById('padStatus').textContent = 'PC와 연결되지 않았습니다.';
                return;
            }
            const imageData = canvas.toDataURL('image/png');
            ws.send(JSON.stringify({
                type: 'SUBMIT_SIGNATURE',
                field_id: targetField.id,
                image_data: imageData
            }));
            targetField.signed = true;
            targetField.img = imageData;
            applyState();
        }
    </script>
</body>
</html>
